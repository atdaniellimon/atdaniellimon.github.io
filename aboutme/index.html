<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About Daniel Limón</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">

    <meta name="description" content="Daniel Limón — the operator behind the holding.">
    <meta name="robots" content="index, follow">
    <meta name="theme-color" content="#0A0B0D">
    <link rel="canonical" href="https://daniellimon.uk/aboutme/">
    <meta property="og:site_name" content="Daniel Limón Holding">
    <meta property="og:type" content="website">
    <meta property="og:locale" content="en_US">
    <meta property="og:url" content="https://daniellimon.uk/aboutme/">
    <meta property="og:title" content="Daniel Limón — About">
    <meta property="og:description" content="Daniel Limón — the operator behind the holding.">
    <meta property="og:image" content="https://daniellimon.uk/src/assets/img/logo.png">
    <meta name="twitter:card" content="summary">
    <meta name="twitter:title" content="Daniel Limón — About">
    <meta name="twitter:description" content="Daniel Limón — the operator behind the holding.">
    <meta name="twitter:image" content="https://daniellimon.uk/src/assets/img/logo.png">

    <script type="importmap">
    { "imports": { "three": "/src/vendor/three.module.min.js" } }
    </script>
</head>
<body>
    <noscript>
        <style>body{opacity:1 !important}.hero,.banner,.philosophy,.model,.ventures-home,.cta-band,.about-prose,.contact-container{display:none !important}</style>
        <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:8vh 8vw;text-align:center">
            <div>
                <h2 style="font-family:'Instrument Serif',serif;font-size:2.4rem;color:#CDAE63;margin:0 0 14px;font-weight:400">Daniel Limón</h2>
                <p style="font-family:serif;color:#C7C4BD;max-width:46ch;margin:0 auto 20px;line-height:1.5">This site is rendered as an interactive shell and needs JavaScript enabled to show its content. You can still reach the operator directly.</p>
                <a href="mailto:d4nilin0n@icloud.com" style="font-family:'JetBrains Mono',monospace;color:#CDAE63;text-decoration:none;border:1px solid #CDAE63;padding:9px 16px;border-radius:6px">d4nilin0n@icloud.com</a>
            </div>
        </div>
    </noscript>
    <section class="hero">
        <div class="hero-text" data-reveal>
            <span class="eyebrow">{{about.eyebrow}}</span>
            <h1><span class="grad">{{about.title}}</span></h1>
            <p class="lede">{{about.lede}}</p>
            <div class="hero-rail" aria-hidden="true">
                <span class="rail-tick"></span>
                <span class="rail-label">Software → Structure</span>
                <span class="rail-tick"></span>
            </div>
        </div>
        <div class="hero-visual" data-reveal>
            <div id="hero-canvas" aria-hidden="true"></div>
        </div>
    </section>

    <section class="about-prose" data-reveal>
        <p>{{about.body1}}</p>
        <p>{{about.body2}}</p>
        <p>{{about.body3}}</p>
        <p>{{about.body4}}</p>
        <p>{{about.body5}}</p>
        <p>{{about.body6}}</p>
        <div class="about-meta">
            <div><span class="about-k">{{about.hq_label}}</span><span class="about-v">{{about.hq}}</span></div>
            <div><span class="about-k">{{about.focus_label}}</span><span class="about-v">{{about.focus}}</span></div>
        </div>
    </section>

    <script src="/src/components/MokeSDK/index.js"></script>
    <script src="/src/utils/injector.js"></script>
    <script src="/src/utils/motion.js"></script>
    <script type="module" src="/src/components/Hero3D/index.js"></script>
</body>
</html>
