<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Limón — About the operator</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <meta name="description" content="Daniel Limón — the engineer behind the holding. First-person: who I am, how I work, and why a holding only earns the name when it runs what it owns.">
    <meta name="robots" content="index, follow">

    <script type="importmap">
    { "imports": { "three": "/src/vendor/three.module.min.js" } }
    </script>
</head>
<body>
    <section class="hero">
        <div class="hero-text" data-reveal>
            <span class="eyebrow">{{about.eyebrow}}</span>
            <h1><span class="grad">{{about.title}}</span></h1>
            <p class="lede">{{about.lede}}</p>
            <div class="hero-rail" aria-hidden="true">
                <span class="rail-tick"></span>
                <span class="rail-label">Kernel → Cloud</span>
                <span class="rail-tick"></span>
            </div>
        </div>
        <div class="hero-visual" data-reveal>
            <div id="hero-canvas"></div>
        </div>
    </section>

    <section class="about-prose" data-reveal>
        <p>{{about.body1}}</p>
        <p>{{about.body2}}</p>
        <p>{{about.body3}}</p>
        <div class="about-meta">
            <div><span class="about-k">{{about.hq_label}}</span><span class="about-v">{{about.hq}}</span></div>
            <div><span class="about-k">{{about.focus_label}}</span><span class="about-v">{{about.focus}}</span></div>
        </div>
    </section>

    <script src="/src/components/MokeSDK/index.js"></script>
    <script src="/src/utils/injector.js"></script>
    <script src="/src/utils/motion.js"></script>
    <script type="module" src="/src/components/Hero3D/index.js"></script>
</body>
</html>
