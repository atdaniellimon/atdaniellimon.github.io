<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daniel Limón — Contact</title>
    <link rel="stylesheet" href="/src/css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <meta name="description" content="Direct line to Daniel Limón — partnerships, investment, and engineering conversations.">
    <meta name="robots" content="index, follow">
</head>
<body>
    <section class="banner" data-reveal>
        <span class="eyebrow">{{hero.contact.title}}</span>
        <h1>{{hero.contact.subtitle}}</h1>
        <div class="links">
            <a href="https://wa.me/12148968727" class="btn-secondary" target="_blank" rel="noopener">WhatsApp</a>
            <a href="mailto:d4nilin0n@icloud.com" class="btn-secondary">Email</a>
            <a href="https://instagram.com/d.limvn" class="btn-secondary" target="_blank" rel="noopener">Instagram</a>
        </div>
    </section>

    <div class="contact-container">
        <div class="email-form contact-card" data-reveal>
            <h1>Tell me more.</h1>
            <input type="text" id="customer_name" placeholder="Name" autocomplete="name">
            <textarea id="request_body" placeholder="Describe your project — what you're building, the stack, the timeline." rows="6"></textarea>
            <button onclick="sendMailForm()">Send</button>
        </div>
    </div>

    <script src="/src/components/MokeSDK/index.js"></script>
    <script src="/src/utils/injector.js"></script>
    <script src="/src/utils/motion.js"></script>
    <script>
        function sendMailForm() {
            const name = document.getElementById('customer_name').value.trim();
            const body = document.getElementById('request_body').value.trim();
            if (!name) { Moke.alert('Please enter your name.'); return; }
            if (!body || body.length < 10) { Moke.alert('Please describe your project.'); return; }
            const mailURL = `mailto:d4nilin0n@icloud.com?subject=${encodeURIComponent('Consult from ' + name)}&body=${encodeURIComponent(body)}`;
            window.location.href = mailURL;
            Moke.alert(`Thanks ${name}! I'll get back to you soon.`);
        }
        window.sendMailForm = sendMailForm;
    </script>
</body>
</html>
